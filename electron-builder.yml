appId: io.github.wangzhongren.ans-studio
productName: ANS Studio
copyright: Copyright © 2026 ANS Studio contributors
asar: false
npmRebuild: false
beforePack: ./src/common/装配/dapr-assets.mjs
directories:
  output: release-output
files:
  - app/**/*
  - src/**/*
  - bin/**/*
  - docs/workflows/**/*.yaml
  - package.json
  - LICENSE
  - '!**/.env*'
  - '!**/.ans{,/**/*}'
  - '!**/*.{log,map}'
  - '!**/test{,/**/*}'
  - '!**/tests{,/**/*}'
extraResources:
  - from: 'release-output/dapr-assets/${os}-${arch}/dapr-runtime'
    to: dapr-runtime
  # Preserve npm's bundled dependency tree for the isolated package-lock runner.
  - from: 'node_modules/npm'
    to: 'app/node_modules/npm'
  - from: 'node_modules/npm/node_modules'
    to: 'app/node_modules/npm/node_modules'
artifactName: 'ANS-Studio-${version}-${os}-${arch}.${ext}'
mac:
  icon: app/desktop/assets/ans-studio-ans-icon.png
  target: zip
  category: public.app-category.developer-tools
  identity: null
  minimumSystemVersion: '13.0'
win:
  icon: app/desktop/assets/ans-studio-ans-icon.png
  target: zip
  signExts:
    - '!daprd.exe'
    - '!scheduler.exe'
publish: null
