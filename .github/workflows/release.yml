name: Build and verify release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Release tag to create after verification
        required: true
        default: v2.2.0
        type: string
      source_sha:
        description: Full SHA of the release commit at the selected workflow ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-v2.2.0
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    # Allow the existing full serial regression on the slower native runners.
    timeout-minutes: 120
    steps:
      - name: Validate release inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          test "$SOURCE_REF" = v2.2.0
          [[ "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SOURCE_SHA" = "$GITHUB_SHA"
      - name: Preserve repository byte identity on native runners
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Assemble the exact frozen release source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node src/common/装配/release-prepare.mjs
      - name: Install exact locked dependencies
        working-directory: .release/source
        run: npm ci
      - name: Typecheck
        working-directory: .release/source
        run: npm run typecheck
      - name: Typecheck renderer
        working-directory: .release/source
        run: npm run typecheck:renderer
      - name: Ensure cross-platform ripgrep for POSIX integration tests
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Regression tests
        working-directory: .release/source
        run: node --test --test-concurrency=1 "test/**/*.test.ts"
      - name: Build renderer bundle
        working-directory: .release/source
        run: npm run build:renderer
      - name: Package native executable
        working-directory: .release/source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify the extracted archive, packaged UI and bundled Dapr
        working-directory: .release/source
        run: node src/common/装配/release-verify.mjs release-output ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .release/source/release-output/*.zip
            .release/source/release-output/manifest-*.json
            .release/source/release-output/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests-${{ matrix.platform }}-${{ matrix.arch }}
          path: .release/source/release-output/native-*.tap
          if-no-files-found: ignore
      - name: Flatten provenance artifact layout
        if: always()
        run: node src/common/装配/release-provenance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-${{ matrix.platform }}-${{ matrix.arch }}
          path: .release/provenance/
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          path: release-provenance
      - name: Verify full native artifact set and source bindings
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node src/common/装配/release-assets.mjs release-assets release-provenance
      - name: Create the verified tag and upload a draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = v2.2.0
          test "$RELEASE_SOURCE_SHA" = "$GITHUB_SHA"
          cd release-assets
          files=(./*.zip ./manifest-*.json ./SHA256SUMS-*.txt ./release-provenance.json ./overlay.patch)
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          for sums in SHA256SUMS-*.txt; do sha256sum -c "$sums"; done

          tag_ref="refs/tags/$SOURCE_REF"
          tag_sha() {
            local matching
            matching="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")" || return
            awk -v ref="$tag_ref" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }' <<< "$matching"
          }
          existing_sha="$(tag_sha)"
          if test -z "$existing_sha"; then
            git push origin "$RELEASE_SOURCE_SHA:$tag_ref"
          fi
          test "$(tag_sha)" = "$RELEASE_SOURCE_SHA"

          metadata="$(mktemp)"
          if gh release view "$SOURCE_REF" --json isDraft,assets > "$metadata"; then
            test "$(jq -r .isDraft "$metadata")" = true
          else
            gh release create "$SOURCE_REF" --verify-tag --draft --title 'ANS Studio 2.2.0' --notes '本版引入随桌面包分发的本地 Dapr Workflow 和 SQLite，支持 YAML 定义的任务派发、审批与逐步恢复，并增加卡点决策和验收证据链。Windows x64、macOS Apple Silicon 和 Intel 的归档均由原生运行器构建、解包验证并提供 SHA-256 校验。安装包未签名和公证。请按同平台校验文件验证下载。'
            gh release view "$SOURCE_REF" --json isDraft,assets > "$metadata"
          fi
          test "$(jq -r .isDraft "$metadata")" = true

          while IFS= read -r existing; do
            test -f "./$existing"
          done < <(jq -r '.assets[].name' "$metadata")
          for file in "${files[@]}"; do
            name="${file#./}"
            if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$metadata" > /dev/null; then
              copy="$(mktemp)"
              gh release download "$SOURCE_REF" --pattern "$name" --output "$copy" --clobber
              cmp "$file" "$copy"
            else
              gh release upload "$SOURCE_REF" "$file"
            fi
          done
          gh release view "$SOURCE_REF" --json isDraft,url,assets
