name: Build and verify release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Frozen application source tag
        required: true
        default: v1.8.2
      publish:
        description: Publish draft after all native gates pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-v1.8.2
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve repository byte identity on native runners
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Assemble frozen source and explicit overlay
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node src/common/装配/release-prepare.mjs
      - name: Install exact locked dependencies
        working-directory: .release/source
        run: npm ci
      - name: Typecheck
        working-directory: .release/source
        run: npm run typecheck
      - name: Ensure cross-platform ripgrep for POSIX integration tests
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Regression tests
        working-directory: .release/source
        run: node --test --test-concurrency=1 "test/**/*.test.ts"
      - name: Build renderer bundle
        working-directory: .release/source
        run: npm run build:renderer
      - name: Package native executable
        working-directory: .release/source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify extracted archive and actual packaged UI
        working-directory: .release/source
        run: node src/common/装配/release-verify.mjs release-output ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .release/source/release-output/*.zip
            .release/source/release-output/manifest-*.json
            .release/source/release-output/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Flatten provenance artifact layout
        if: always()
        run: node src/common/装配/release-provenance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-${{ matrix.platform }}-${{ matrix.arch }}
          path: .release/provenance/
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          path: release-provenance
      - name: Verify full native artifact set and source bindings
        run: node src/common/装配/release-assets.mjs release-assets release-provenance
      - name: Verify and upload only passing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          cd release-assets
          test "$(find . -name '*.zip' | wc -l)" -eq 3
          for sums in SHA256SUMS-*.txt; do sha256sum -c "$sums"; done
          if gh release view v1.8.2 --json isDraft --jq '.isDraft' > draft-state.txt; then
            test "$(cat draft-state.txt)" = true
          else
            gh release create v1.8.2 --verify-tag --draft --title 'ANS Studio 1.8.2' --notes '基于固定 v1.8.2 源码及 manifest 列明的打包适配 overlay。macOS arm64、macOS x64、Windows x64 各由原生 runner 构建并实际启动验证。本补丁修复 D3 选中集记账：仅 appointment 卡的裁决写入选中角色集，任意决策/确认/验收卡的选项不再被当作项目角色（读侧只认 D3 裁决，历史污染记录自动忽略、无需迁移数据）。其余能力与 v1.8.1 相同：意图入口契约对角色可见、投递与会话收尾不变量与停止解楔、请求级超时与 SDK api_retry 诊断、网络状态监听、仅 replay-safe 安全重试、验收卡归属三段式指引、图片预算移除。未签名、未公证：macOS Gatekeeper 或 Windows SmartScreen 可能提示，请先核对 SHA256。最低 macOS 13；Windows 10/11 x64。Windows 暂不支持内置受限来源文档阅读；保留完整摘要与执行记录，来源文件可由系统编辑器查看。发布包不包含任何凭据，首次使用请在设置中填写。详细来源与测试见各平台 manifest。'
          fi
          gh release upload v1.8.2 ./*.zip ./manifest-*.json ./SHA256SUMS-*.txt ./release-provenance.json ./overlay.patch
          if test "$RELEASE_PUBLISH" = true; then gh release edit v1.8.2 --draft=false; fi
