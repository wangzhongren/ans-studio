schema: 2
id: path-b
version: 3
name: 路径 B
start: qualify-change
steps:
  qualify-change:
    action: observe-existing
    next: prepare-branch
  prepare-branch:
    action: prepare-existing-branch
    next: impact
  impact:
    action: b1-impact-readonly
    role: module-owner
    on:
      usable: scope
      needsFollowup: blocked
      blocked: blocked
  scope:
    action: accept-b3-advance-with-b2-scope
    next: implement
  implement:
    action: b3-implement-and-accept
    role: module-owner
    next: release
  release:
    action: b4-customer-merge-main
    on:
      merged: delivered
      rejected: stopped
  blocked: { terminal: blocked }
  stopped: { terminal: stopped }
  delivered: { terminal: delivered }
