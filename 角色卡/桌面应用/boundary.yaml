# 桌面应用边界 —— Section 1 唯一写入白名单
# 未列路径默认只读。新增目录、改动归属或增删逐条列出的路径，须先由 ANS Governance 更新本文件并经客户确认。
# 本角色是 Interface 层的桌面能力：判定一律调门禁引擎，Pi 调用一律经 Pi 适配器。
role: 桌面应用
entries:
  - kind: directory
    path: app/
    purpose: Electron 主进程、preload 桥与渲染进程前端
  - kind: directory
    path: test/桌面应用/
    purpose: 本角色的单元与界面测试及夹具
  - kind: file
    path: 角色卡/桌面应用/feature-map.md
    purpose: 功能导航
  - kind: file
    path: 角色卡/桌面应用/memo.md
    purpose: 本角色工作备忘录
  - kind: file
    path: 角色卡/桌面应用/changelog.md
    purpose: 本角色治理变更记录
  - kind: file
    path: 角色卡/桌面应用/functional-description.md
    purpose: 模块笔记与代码位置
  - kind: file
    path: 角色卡/桌面应用/api-spec.md
    purpose: 实现报告（IPC 通道与导出）
  - kind: directory
    path: 角色卡/桌面应用/docs/design/
    purpose: 设计记录
  - kind: directory
    path: 角色卡/桌面应用/docs/feature/
    purpose: 本角色功能的稳定说明与流程图
  - kind: directory
    path: 角色卡/桌面应用/docs/change/
    purpose: 变更记录
  - kind: directory
    path: 角色卡/桌面应用/docs/fix/
    purpose: 修复记录

# 注：package.json 的 electron 依赖、scripts 与入口字段属装配角色；跨角色需求交项目管理协调。
