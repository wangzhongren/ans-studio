# 项目管理边界 —— Section 1 唯一写入白名单
# 未列路径默认只读。新增目录、改动归属或增删逐条列出的路径，须先由 ANS 人事更新本文件并经客户确认。
# 共享代码（src/common/shared/）及其测试（test/项目管理/shared/）、共享组件目录自 2026-11-07
# 团队计划 §5.4 B-9/§6.4 起由 shared-code 维护，本角色不再拥有。
role: 项目管理
entries:
  - kind: file
    path: 角色卡/项目管理/feature-map.md
    purpose: 功能导航
  - kind: file
    path: 角色卡/项目管理/memo.md
    purpose: 本角色工作备忘录
  - kind: file
    path: 角色卡/项目管理/changelog.md
    purpose: 本角色治理变更记录
  - kind: file
    path: 角色卡/项目管理/functional-description.md
    purpose: 模块笔记与代码位置
  - kind: file
    path: 角色卡/项目管理/api-spec.md
    purpose: 本角色实现报告（无共享代码后按技能如实说明不适用）
  - kind: file
    path: 角色卡/项目管理/docs/architecture.md
    purpose: 整体架构与角色协作
  - kind: directory
    path: 角色卡/项目管理/docs/architecture/
    purpose: 本角色自己的架构细分文档（共享组件目录已按团队计划 §6.4 移交 shared-code；shared-components.md 旧副本由本角色在 E1 迁移窗口删除）
  - kind: file
    path: 角色卡/项目管理/docs/project-rules.md
    purpose: 全项目唯一工程法案
  - kind: directory
    path: 角色卡/项目管理/docs/meetings/
    purpose: 会议纪要
  - kind: directory
    path: 角色卡/项目管理/docs/design/
    purpose: 设计记录与跨角色对接设计
  - kind: directory
    path: 角色卡/项目管理/docs/change/
    purpose: 变更记录
  - kind: directory
    path: 角色卡/项目管理/docs/fix/
    purpose: 修复记录
  - kind: directory
    path: docs/scheduling/
    purpose: 任务调度记录（内容由 task_ops 写入）
  - kind: conditional-directory
    path: docs/audit/
    condition: shell-gate
    root: project
    purpose: shell 闸的放行/拒绝审计留痕（shell-gate.jsonl）
