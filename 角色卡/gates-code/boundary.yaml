# 门控代码维护角色边界 —— Section 1 唯一写入白名单
# 未列路径默认只读。新增/变更路径须先由 ANS 人事更新本文件并经客户确认。
# 模块纪律：唯一 public entry 为 index.ts；只判定、不采集证据；不 import 角色模块/Service/Provider/Pipeline；
# 不把写路径/边界判定并入；只依赖 Model/shared public entry；门 API 冻结后变更走接口评审。
role: gates-code
entries:
  - kind: directory
    path: src/common/gates/
    purpose: 运行时派发/准入判定模块（greenfield；唯一 public entry index.ts；内部文件可增删/拆分，模块根不得散放其他文件）
  - kind: directory
    path: test/gates/
    purpose: 门测试矩阵、正/负例、与 D-minimal 内联实现的差分，及 module-graph.test.ts 静态扫描（用仓内 TypeScript Compiler API，不新增依赖）
  - kind: file
    path: 角色卡/gates-code/feature-map.md
    purpose: 功能导航
  - kind: file
    path: 角色卡/gates-code/memo.md
    purpose: 本角色工作备忘录
  - kind: file
    path: 角色卡/gates-code/functional-description.md
    purpose: 实际职责、交接与代码位置
  - kind: file
    path: 角色卡/gates-code/api-spec.md
    purpose: 模块 public API 实现报告
  - kind: directory
    path: 角色卡/gates-code/docs/design/
    purpose: 设计记录
  - kind: directory
    path: 角色卡/gates-code/docs/feature/
    purpose: 稳定功能说明与流程图
  - kind: directory
    path: 角色卡/gates-code/docs/change/
    purpose: 变更记录与证据
  - kind: directory
    path: 角色卡/gates-code/docs/fix/
    purpose: 修复记录
