function send(){if($('send').disabled)return;const text=$('message').value.trim();if(!text){setStatus('请先输入消息；图片需要随文字一起发送。',true);$('message').focus();return}saveDraft();if(s.stage==='send-failure'){s.stage='chat';s.messages.push({kind:'assistant',text:'模拟重试已收到消息。此处只恢复普通聊天，不自动生成任务或报告。'})}else if(['running','stopping'].includes(s.stage)){s.queue.push({text,kind:'客户消息',status:'第 '+(s.queue.length+1)+' 位'});s.drafts[key()]='';render();setStatus('已排队；当前轮次结束后才会处理。');return}else{s.stage='chat';s.messages.push({kind:'user',text},{kind:'assistant',text:'演示已收到。这是普通对话；如果需求涉及正式派发，后续由主入口按实际流程决定，不能仅凭输入文字当作已经派发。'})}s.drafts[key()]='';s.attachment=false;render();$('message').focus();$('chat').scrollTop=$('chat').scrollHeight}
$('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('stop').onclick=()=>{saveDraft();s.stage='stopping';s.messages.push({kind:'stop-request'});render();setStatus('停止请求已受理，等待轮次结束；排队与草稿保留。')};

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden){e.preventDefault();closeModal()}else if(s.drawer){e.preventDefault();closeDrawer()}}if(e.key==='Tab'&&!$('modal').hidden){const buttons=[...$('modal').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});$('demo-stage').onchange=e=>stagePreset(e.target.value);$('demo-reset').onclick=()=>{s.drafts={};stagePreset('empty')};$('demo-size').onchange=e=>{$('app').style.width=e.target.value+'px';$('app').style.height=e.target.value==='960'?'620px':'860px';closeMenu()};$('demo-next').onclick=()=>{if(s.stage==='empty'){importDialog();return}if(s.stage==='missing'){openDrawer('settings',$('demo-next'));return}if(['choice','confirm'].includes(s.stage)&&s.confirm==='pending'){setStatus('请先在模拟确认卡选择同意或不同意；不会自动代答。');$('confirmation').focus();return}if(['choice','confirm'].includes(s.stage)&&s.confirm==='declined'){setStatus('模拟请求未获同意，没有推进执行。可从演示起点重新查看。');return}if(s.stage==='failure'){stagePreset('running');return}if(s.stage==='stopping'){s.stage='chat';render();setStatus('模拟轮次已结束；原队列和草稿保留。');return}if(s.stage==='choice'){s.confirm='accepted';render();setStatus('选择流程已处理；下一任务需独立发起，不自动转正式派发。');return}const i=stages.indexOf(s.stage);stagePreset(stages[Math.min(stages.length-1,i+1)]||'chat')};stagePreset('empty');
