 solid #b16452;background:#fcf5f2;font-size:12px}.exception strong{font-size:12px;color:var(--red);display:block;margin-bottom:4px}.exception .target{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;overflow-wrap:anywhere;color:#73625d}.pending{border:1px solid #ddd6c5;border-left:3px solid #a99060;background:#fbfaf5;padding:15px;margin:20px 0;font-size:13px}.pending strong{display:block;margin-bottom:6px}.pending p{margin:0 0 12px}.button-row{display:flex;gap:8px;flex-wrap:wrap}.secondary{border:1px solid #d8dcd2;background:white;padding:5px 10px;border-radius:5px;font-size:12px}.primary{background:#292d27;color:white;border:1px solid #292d27;padding:6px 12px;border-radius:5px;font-size:12px}.primary:hover{background:#464e40}.pending-link{font-size:11px;white-space:nowrap;color:var(--amber);padding:4px 9px;border-radius:4px}.composer-area{border-top:1px solid var(--line);padding:20px 28px 22px;background:white;position:relative;z-index:4;min-width:0}.composer{display:flex;align-items:center;gap:12px;border:1px solid #e2e5de;border-radius:30px;padding:8px 10px 8px 14px;background:var(--soft);min-width:0;height:52px}.composer textarea{resize:none;border:0;background:transparent;min-width:0;flex:1;line-height:24px;height:26px;outline:none;font-size:13px}.composer textarea::placeholder{color:#92988c}.send{width:32px;height:32px;border-radius:50%;display:flex;justify-content:center;align-items:center;background:#262a24;color:white;flex-shrink:0}.send:hover{background:#414b3b}.stop{width:30px;height:30px;color:#676f60;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}.stop svg{width:12px;height:12px}.drawer{position:absolute;right:0;top:36px;bottom:100px;width:360px;background:#fcfcfa;border-left:1px solid #dce1d5;z-index:3;display:flex;flex-direction:column;min-height:0}.drawer[hidden]{display:none}.drawer-head{height:66px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:14px;margin:0;font-weight:650;white-space:nowrap}.drawer-scroll{padding:20px;overflow-y:auto;min-height:0}.drawer-eyebrow{font-size:11px;color:var(--muted);margin-bottom:12px}.work-heading{font-size:12px;font-weight:650;margin:0 0 9px}.work-item{border-left:2px solid #8f9b82;padding:1px 0 3px 12px;margin-bottom:22px}.work-item p{font-size:13px;line-height:1.7;margin:4px 0}.meta{font-size:10px;color:#7f8878;display:flex;gap:8px;flex-wrap:wrap}.queue{margin:0 0 23px;padding:0;list-style:none}.queue-item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:19px minmax(0,1fr);gap:7px}.queue-index{color:#989e92;font-size:11px;padding-top:1px}.queue-body p{font-size:12px;margin:4px 0 7px;line-height:1.75}.item-actions{display:flex;gap:12px;align-items:center}.text-button{font-size:11px;color:#5c7151;padding:1px 0;text-decoration:underline;text-underline-offset:3px}.text-button.withdraw{color:#876857}.full-text{font-size:12px;line-height:1.85;background:#f0f3ec;margin-top:10px;padding:10px;overflow-wrap:anywhere;white-space:pre-wrap}.empty{margin:2px 0 24px;color:#828b7b;font-size:12px;padding:10px 0}.resource{border-top:1px solid var(--line);padding:12px 0;font-size:12px}.resource summary{display:flex;gap:8px;align-items:center;list-style:none;cursor:pointer;font-weight:600}.resource summary::before{content:'›';font-size:18px;line-height:16px;color:#a2a895}.resource[open] summary::before{transform:rotate(90deg)}.resource summary .subcount{margin-left:auto;color:#909985;font-size:10px;font-weight:400}.resource-body{padding:11px 0 2px 21px;font-size:12px;line-height:1.85;color:#606b56;overflow-wrap:anywhere}.resource-body h3{font-size:13px;margin:0 0 6px}.resource-body pre{font:11px/1.7 ui-monospace,monospace;background:#f0f2eb;padding:10px;overflow:auto}.field{display:block;margin:17px 0;font-size:11px;color:#717b68}.field input{width:100%;font-family:ui-monospace,monospace;font-size:12px;border:1px solid #dce1d5;padding:9px 10px;border-radius:5px;background:white;margin-top:5px;min-width:0;color:#47513f}.secret-line{display:flex;gap:9px;align-items:center}.secret-line button{font-size:11px;white-space:nowrap}.secret-tag{font-size:9px;background:#ecefe6;padding:1px 5px;border-radius:3px;margin-left:6px}.path{font:10px/1.7 ui-monospace,monospace;color:#8b9382;overflow-wrap:anywhere;display:block;background:#f3f5ef;border-radius:4px;padding:8px;margin:8px 0 14px}.pi-info{font-size:11px;line-height:1.85;color:#737c68;margin-bottom:20px}.save-row{display:flex;gap:11px;align-items:center;margin-top:16px;flex-wrap:wrap}.save-status{font-size:11px;color:#768966}.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:#323a2c;color:white;border-radius:6px;font-size:12px;padding:9px 15px;z-index:8;max-width:80%;text-align:center}.toast[hidden]{display:none}.caption{font-size:11px;color:#79816f;text-align:center;margin:15px 0 0}.wide-code{overflow:auto;max-width:100%;font:11px/1.7 ui-monospace,monospace;background:#f4f5f1;padding:12px;white-space:pre}.app[data-width="960"] .chat-scroll{padding:24px}.app[data-width="960"] .chat-head{padding:14px 24px}.app[data-width="960"] .composer-area{padding-left:24px;padding-right:24px}.app[data-width="960"] .drawer{width:360px}

<body>
<section class="demo" aria-label="设计原型演示控件">
 <div class="demo-head"><strong>ANS 页面设计 · v2</strong><span class="demo-tag">设计原型 / 模拟状态</span><span class="demo-note">所有动作仅在本页模拟，无业务接口或模型任务。</span></div>
 <div class="controls">
  <label>受控画布<select id="size"><option value="1360">1360 × 860</option><option value="960">960 × 620</option></select></label>
  <label>对话状态<select id="chatState"><option value="settled">轮末 · 默认折叠</option><option value="working">工作中</option><option value="expanded">用户展开记录</option><option value="exceptions">失败 / 拒绝 / 未决</option><option value="stopped">本轮已停止</option></select></label>
  <label>角色工作<select id="queueState"><option value="empty">空闲 · 空队列</option><option value="populated">1 项工作 + 3 项排队</option><option value="full">排队全文展开</option><option value="queued">无当前工作 + 3 项排队</option><option value="current">1 项工作 / 无排队</option></select></label>
  <label>撤回模拟返回<select id="withdrawResult"><option value="success">成功</option><option value="failure">失败</option></select></label>
  <button class="control-button" id="refresh">模拟快照刷新</button><button class="control-button" id="reset">重置演示</button>
 </div>
</section>
<div class="workspace"><div class="stage-wrap" id="stage"><div class="app" id="app" data-width="1360">
 <header class="titlebar"><div class="brand">ANS<span>治理会话工作台</span></div><div class="title-actions">
  <button id="roleToggle" class="icon-button" aria-label="角色资料" aria-pressed="false"></button><button id="piToggle" class="icon-button" aria-label="Pi 配置" aria-pressed="false"></button>
  <span class="window-control" aria-hidden="true">−</span><span class="window-control" aria-hidden="true">□</span><span class="window-control" aria-hidden="true">×</span>
 </div></header>
 <aside class="sidebar"><div class="section-label">项目</div><button class="switch" id="projectSwitch">切换项目</button><div class="project-name">ssh-tool</div><div class="project-path">/Users/demo/code/vibeingcode/ssh-tool</div><div class="role-caption">主入口</div><div id="roles"></div><div class="sidebar-foot">演示项目 · 本地数据</div></aside>
 <main class="main"><header class="chat-head"><div><div class="chat-title" id="chatTitle">su</div><div class="governance-note">写入受当前角色边界约束。</div></div><button class="pending-link" id="pendingJump" hidden>定位待确认</button></header><div class="chat-scroll" id="chatScroll"><div class="conversation" id="conversation"></div></div><footer class="composer-area"><div class="composer"><button class="icon-button" id="imageButton" aria-label="添加图片"></button><textarea id="draft" aria-label="消息草稿" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><button class="stop" id="stopButton" aria-label="停止当前轮次" hidden></button><button class="send" id="sendButton" aria-label="发送消息"></button></div></footer></main>
 <aside class="drawer" id="drawer" hidden aria-label="辅助抽屉"><header class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-button" id="closeDrawer" aria-label="关闭抽屉"></button></header><div class="drawer-scroll" id="drawerBody"></div></aside>
 <div class="toast" id="toast" role="status" hidden></div>
</div></div><p class="caption">画布按可用宽度缩放以完整检查；改变画布只改变原型，不改变用户窗口。右上图标、执行记录、队列全文、撤回、资料、Pi 保存、发送/停止均可点击。</p></div>
<script>
const $=s=>document.querySelector(s);
const icons={doc:'<path d="M5 2.5h6l4 4v12H5z"/><path d="M11 2.5v4h4M8 10h4M8 13h4M8 16h4"/>',gear:'<path d="m8 2-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h3l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3z"/><circle cx="9.5" cy="11" r="3"/>',shield:'<path d="m10 2 7 3v5c0 4-3 6-7 8-4-2-7-4-7-8V5z"/>',image:'<rect x="2" y="2" width="16" height="16" rx="2"/><circle cx="7" cy="7" r="1.5"/><path d="m3 16 5-6 4 4 3-3 3 4"/>',up:'<path d="M10 17V3m-6 6 6-6 6 6"/>',stop:'<rect x="5" y="5" width="10" height="10" rx="1" fill="currentColor" stroke="none"/>',close:'<path d="m5 5 10 10M15 5 5 15"/>'};
const svg=name=>'<svg viewBox="0 0 20 20" aria-hidden="true">'+icons[name]+'</svg>';
$('#roleToggle').innerHTML=svg('doc');$('#piToggle').innerHTML=svg('gear');$('#imageButton').innerHTML=svg('image');$('#sendButton').innerHTML=svg('up');$('#stopButton').innerHTML=svg('stop');$('#closeDrawer').innerHTML=svg('close');
function newModel(hasHistory){return {chat:'settled',hasQueue:false,working:false,withdrawn:false,details:{},full:false,records:{},pending:false,chatScroll:0,drawerScroll:0,draft:'',hasHistory,extraRows:[],refreshCount:0}}
const state={role:'su',drawer:null,models:{su:newModel(true),'桌面应用':newModel(false)},piScroll:0};let toastTimer;
const roleModel=()=>state.models[state.role];
Object.defineProperties(state,{chat:{get:()=>roleModel().chat,set:v=>roleModel().chat=v},pending:{get:()=>roleModel().pending,set:v=>roleModel().pending=v},records:{get:()=>roleModel().records,set:v=>roleModel().records=v}});
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function layout(){const w=Number($('#size').value),h=w===960?620:860;const scale=Math.min(1,(document.documentElement.clientWidth-32)/w);$('#app').style.width=w+'px';$('#app').style.height=h+'px';$('#app').dataset.width=w;$('#app').style.transform=`scale(${scale})`;$('#stage').style.width=w*scale+'px';$('#stage').style.height=h*scale+'px'}
window.addEventListener('resize',layout);$('#size').onchange=layout;
function roleBusy(){return roleModel().working}
function roleHasQueue(){return roleModel().hasQueue}
function queueMode(m){return m.hasQueue?(m.working?(m.full?'full':'populated'):'queued'):(m.working?'current':'empty')}
function syncControls(){$('#chatState').value=state.chat;$('#queueState').value=queueMode(roleModel())}
function modelLabel(m){return m.chat==='exceptions'&&!m.pending?'等待确认':m.working?'工作中':'空闲'}
function modelCount(m){return (m.working?1:0)+(m.hasQueue?(m.withdrawn?2:3):0)}
function drawRoles(){const count=modelCount(roleModel());$('#roleToggle').innerHTML=svg('doc')+(count?`<span class="badge">${count}</span>`:'');$('#roleToggle').setAttribute('aria-label','角色资料'+(count?'，'+count+' 项工作及排队':''));$('#roles').innerHTML=['su','桌面应用'].map(r=>{const m=state.models[r];return `<button class="role-button ${r===state.role?'selected':''}" data-role="${r}">${svg('shield')}<span class="role-name">${r}<span class="role-sub">${r==='su'?'内置治理主入口':'界面实现角色 · 设计示例'}</span></span><span class="role-state"><span class="dot"></span>${modelLabel(m)}${m.hasQueue?' · 排队 '+(m.withdrawn?2:3):''}</span></button>`}).join('');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{roleModel().chatScroll=$('#chatScroll').scrollTop;if(state.drawer==='role')roleModel().drawerScroll=$('#drawerBody').scrollTop;roleModel().draft=$('#draft').value;state.role=b.dataset.role;$('#chatTitle').textContent=state.role;$('#draft').value=roleModel().draft;syncControls();drawRoles();drawChat();drawDrawer()})}
function recordGroup(id,rows,open=false){const opened=state.records[id]??open;return `<details class="records" data-record="${id}" ${opened?'open':''}><summary>查看执行记录<span class="record-count">${rows.length} 条活动</span>${rows.some(r=>r[3]==='unknown')?'<span class="record-count">· 含状态未记录</span>':''}</summary>${rows.map(r=>`<div class="record-row"><span>${r[0]}</span><span class="record-op">${r[1]}<span class="record-target">${r[2]}</span></span><span class="record-status ${r[3]==='unknown'?'unknown':''}">${r[4]}</span></div>`).join('')}</details>`}
const suRows=[['10:24','run_shell','ls -la src/components src/store','call','调用发起'],['10:24','run_shell','ls -la src/components src/store · exit 0','result','退出码 0'],['10:25','read_file','src/App.jsx','call','调用发起'],['10:25','read_file','src/App.jsx · 可靠结果示例','result','读取返回'],['10:25','read_file','.ans/sessions/su/session.jsonl','call','调用发起'],['10:25','read_file','.ans/sessions/su/session.jsonl · 旧回放','unknown','状态未记录']];
const desktopRows=[['11:02','read_file','app/renderer/styles.css','call','调用发起'],['11:02','read_file','app/renderer/styles.css · 可靠结果示例','result','读取返回'],['11:03','run_shell','检查布局尺寸 · 本地设计示例','unknown','状态未记录']];
function roleRows(){const base=state.role==='su'?suRows:desktopRows;return (['working','stopped'].includes(state.chat)?base.slice(0,3):base).concat(roleModel().extraRows)}
function drawChat(){const m=roleModel(),sc=$('#chatScroll'),previous=m.chatScroll;let html=m.hasHistory?'<div class="user-message"><div class="user-bubble">'+(state.role==='su'?'我希望继续开发这个 SSH 工具，先看看目前的项目。':'请检查聊天和辅助抽屉的布局边界。')+'</div></div><div class="speaker">'+state.role+'</div>':'<div class="speaker">'+state.role+'</div>';
 if(!m.hasHistory)html+='<div class="assistant"><p>此示例角色尚无对话。</p></div>';
 else
 if(state.chat==='working')html+=recordGroup('routine',roleRows())+ '<div class="current-action"><span class="pulse"></span>正在工作</div><div class="assistant"><p>我先核对现有项目和角色边界，再确认接下来的范围。</p></div>';
 else if(state.chat==='stopped')html+=recordGroup('routine',roleRows())+'<div class="assistant"><p>本轮已停止 · 模拟状态。保留停止前的执行记录，未生成新的助手结论。</p></div>';
