# boundary.md Section 1 的兼容同步副本；保留产品 role/entries schema。
# Markdown 为授权来源；二者须一致，组别不合并权限，未列路径默认只读。
role: 运行时核心
entries:
  - kind: file
    path: src/model/runtime.ts
    purpose: 中立运行时类型与能力契约
  # --- Delta-GTS-1（2026-11-02，团队计划 §4.5；闸门 2）：新增 1 个共享 Model 文件（project-state），逐文件授权 ---
  - kind: file
    path: src/model/project-state.ts
    purpose: 全局任务状态/版本决策的共享 Model 类型（`ProjectStateView`/`VersionDecisionCard`/`VersionDecisionRequest/Result`；无 I/O）
  # --- Delta-CAP-1（2026-11-03，团队计划 §4.5；闸门 2）：新增 2 个共享 Model 文件（directive-marker、directive），逐文件授权 ---
