<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>ANS 治理会话工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 自绘标题栏（客户要求：去掉原生标题栏与默认菜单栏，自己搞一个）。
         左＝应用标识；右＝三个窗口按钮（最小化 / 最大化-还原 / 关闭），经 IPC 接主进程。
         整条为拖动区（-webkit-app-region: drag）；按钮为 no-drag（否则点不动）。
         **双击拖动区最大化**＝Windows 惯例，由系统在拖动区（按 HTCAPTION 处理）上**原生**完成，故此处不挂 dblclick。 -->
    <div id="titlebar" class="titlebar">
      <div class="titlebar-brand">
        <span class="titlebar-mark">ANS</span>
        <span class="titlebar-sub">治理会话工作台</span>
      </div>
      <div class="titlebar-controls">
        <button id="win-min" class="win-btn" type="button" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 6h7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button id="win-max" class="win-btn" type="button" title="最大化" aria-label="最大化">
          <svg class="ico-max" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <svg class="ico-restore" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.5" y="3.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4.5 3.5V2.5h6v6h-1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        </button>
        <button id="win-close" class="win-btn win-btn-close" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="app">
      <!-- 左栏：项目与角色树 -->
      <aside class="col col-left">
        <!-- 应用标识已上移到自绘标题栏（不在此重复堆砌）；此栏头只作分区标签，与右栏「角色资料」并列。 -->
        <header class="side-head">
          <span class="side-title">项目</span>
        </header>
        <div class="side-actions">
          <button id="btn-import" class="btn btn-primary btn-block">导入项目…</button>
          <div id="project-path" class="project-path is-empty">尚未导入项目</div>
        </div>
        <div class="tree-label">角色</div>
        <nav id="role-tree" class="tree" aria-label="角色列表"></nav>
        <div id="warnings" class="warnings"></div>
      </aside>

      <!-- 中栏：与角色的聊天（点角色即开，多轮直发） -->
      <main class="col col-mid">
        <header class="chat-head">
          <div class="chat-head-top">
            <div class="chat-head-main">
              <span id="chat-role" class="chat-role">未选择角色</span>
              <span id="chat-role-sub" class="chat-role-sub">从左侧选择一个角色开始聊天</span>
            </div>
            <span id="session-state" class="pill pill-idle">未连接</span>
            <button id="btn-pi-settings" class="btn btn-ghost btn-pi" type="button"
              title="设置 Pi 运行时配置（保存到 .env）">Pi 设置</button>
            <button id="btn-stop" class="btn btn-ghost" disabled>结束会话</button>
          </div>
          <!-- 提示上移至横栏（客户 2026-10-11 裁定：去掉运行时选择器、默认跑 pi，底部只剩输入框）。
               状态提示与写入语义各压缩为一行；写入语义如实保留（pi 会真正写入导入的项目，但受角色边界约束）。 -->
          <div class="chat-head-notes">
            <span id="composer-hint" class="composer-hint"></span>
            <span id="runtime-note" class="runtime-note"></span>
          </div>
        </header>

        <div id="chat" class="chat">
          <div class="chat-empty">
            <svg class="empty-icon" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
            <p class="empty-title">导入项目后，点击左侧任意角色即可开始聊天</p>
            <p class="empty-sub">无需确认与设置。写入由治理引擎在后台把关，越界操作会在对话中直接提示。</p>
          </div>
        </div>

        <!-- 创世 finalize（T36/T38）：bootstrap 收口的**触发入口**（**仅创世 su 会话**显示，默认隐藏）。
             客户裁定（设计 §13）：完成 = **su 提议「可以收口了」→ 界面把这件事摆给客户 → 客户确认 → 才落盘**。
             点此按钮 = 请 su 发起收口提议（T37 的 finalize 语义 = 提议、非立即完成）；提议随即以**聊天流里的
             确认卡**呈现（提议原文 + `[确认完成]`/`[暂不]`，`renderer.js::appendFinalizeProposal`）。确认后才
             由代码算 SHA-256、写治理边界文档 + .ans/project.json（pin）+ docs/bootstrap-manifest.md；结果如实呈现。 -->
        <div id="bootstrap-action" class="bootstrap-action" hidden></div>

        <!-- Pi 配置面板（设计 §11/T28）：设置 pi 运行时所需配置，保存到仓库根 .env。
             默认收起；点横栏的「Pi 设置」展开。token 字段掩码，且值不回显（恒空、只示「已设置/未设置」）。 -->
        <div id="pi-panel" class="pi-panel" hidden>
          <div class="pi-panel-head">
            <span class="pi-panel-title">Pi 配置</span>
            <span id="pi-panel-path" class="pi-panel-path"></span>
            <button id="pi-close" class="btn btn-ghost btn-mini" type="button">收起</button>
          </div>
          <p class="pi-panel-hint">保存写入<strong>仓库根 .env</strong>（已 gitignore、不入库）。只修改下面的键，文件其余内容原样保留；保存后下一会话即用新值。</p>
          <div class="pi-fields">
            <label class="pi-field" for="pi-inp-ANTHROPIC_AUTH_TOKEN">
              <span class="pi-field-label">ANTHROPIC_AUTH_TOKEN <span class="pi-secret-tag">机密</span></span>
              <span class="pi-input-wrap">
                <input id="pi-inp-ANTHROPIC_AUTH_TOKEN" class="pi-input" type="password" autocomplete="off" spellcheck="false" />
                <button id="pi-toggle-secret" class="btn btn-ghost btn-mini" type="button">显示</button>
              </span>
            </label>
            <label class="pi-field" for="pi-inp-ANS_PI_BASE_URL">
              <span class="pi-field-label">ANS_PI_BASE_URL</span>
              <input id="pi-inp-ANS_PI_BASE_URL" class="pi-input" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <label class="pi-field" for="pi-inp-ANS_PI_MODEL">
              <span class="pi-field-label">ANS_PI_MODEL</span>
              <input id="pi-inp-ANS_PI_MODEL" class="pi-input" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <label class="pi-field" for="pi-inp-ANS_PI_PROVIDER">
              <span class="pi-field-label">ANS_PI_PROVIDER</span>
              <input id="pi-inp-ANS_PI_PROVIDER" class="pi-input" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <label class="pi-field" for="pi-inp-ANS_PI_CONTEXT_WINDOW">
              <span class="pi-field-label">ANS_PI_CONTEXT_WINDOW</span>
              <input id="pi-inp-ANS_PI_CONTEXT_WINDOW" class="pi-input" type="text" autocomplete="off" spellcheck="false" />
            </label>
          </div>
          <div class="pi-actions">
            <button id="pi-save" class="btn btn-primary btn-mini" type="button">保存到 .env</button>
            <span id="pi-status" class="pi-status"></span>
          </div>
        </div>

        <!-- 底部输入区：只剩输入框 + 发送（客户 2026-10-11 裁定）。 -->
        <div class="composer">
          <div class="composer-row">
            <textarea
              id="inp-message"
              rows="1"
              placeholder="输入消息，Enter 发送，Shift+Enter 换行"
              spellcheck="false"
            ></textarea>
            <button id="btn-send" class="btn btn-primary btn-send" disabled>发送</button>
          </div>
        </div>
      </main>

      <!-- 右栏：角色资料（手风琴分组） -->
      <aside class="col col-right">
        <header class="side-head">
          <span id="right-title" class="side-title">角色资料</span>
        </header>
        <div id="right-body" class="right-body">
          <div class="right-empty">
            <svg class="empty-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
            </svg>
            <p class="empty-title">选择角色后查看资料</p>
            <p class="empty-sub">角色卡、边界条目、变更记录与文档索引。</p>
          </div>
        </div>
      </aside>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
